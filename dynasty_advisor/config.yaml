---
slug: dynasty_advisor
name: Dynasty Advisor
version: "0.6.0"
description: >-
  Trade targets and add/drop recommendations for a Sleeper dynasty football
  league. Read-only: it recommends, you make the moves in Sleeper.
url: https://github.com/ilituchy/ha-automations/tree/main/dynasty_advisor

arch:
  - aarch64
  - amd64

# The base image ships s6-overlay v3, which is the container's init.
init: false

# Core API via the Supervisor proxy, for phone notifications only.
homeassistant_api: true

# The page is served only through the HA sidebar. No `ports:` key, so 8099 is
# never published on the host; the app also refuses any client that is not the
# ingress proxy.
ingress: true
ingress_port: 8099
panel_icon: mdi:football
panel_title: Dynasty Advisor

# /data holds reports, run journals and daily value snapshots (all small and
# worth keeping) plus an HTTP cache that includes Sleeper's 15 MB player file,
# which is refetched daily anyway and has no business in a backup.
backup_exclude:
  - "cache/*"

options:
  username: ""
  league_id: ""
  strategy: auto
  # When to run on its own and send the result to your phone, as "<day> HH:MM"
  # (mon..sun or daily), in Home Assistant's timezone. Waivers in a Sleeper
  # league clear just after midnight Pacific going into Wednesday, so Tuesday
  # evening is the last useful moment for pickups.
  schedule:
    - "tue 18:00"
    - "sat 10:00"
  # A notify service, e.g. mobile_app_iphone (Settings > Companion app shows
  # your device). Empty = scheduled runs still happen, nothing is sent.
  notify_service: ""
  # Players never to offer in a trade, by name as Sleeper spells it.
  untouchable: []
  # An Anthropic API key turns on the AI review of every trade idea and
  # pickup (one request per run, billed to your Anthropic account).
  anthropic_api_key: ""
  ai_model: claude-opus-5-5
  log_level: info

schema:
  username: str?
  league_id: str?
  strategy: list(auto|contend|balanced|rebuild)
  schedule:
    - match(^\s*(mon|tue|wed|thu|fri|sat|sun|daily)\s+([01]?\d|2[0-3]):[0-5]\d\s*$)
  notify_service: str?
  untouchable:
    - str
  anthropic_api_key: password?
  ai_model: str?
  log_level: list(debug|info|warning|error)
