---
configuration:
  username:
    name: Sleeper username
    description: >-
      Your Sleeper username (the one in your profile, not your email).
  league_id:
    name: League ID
    description: >-
      The long number in your league's URL on sleeper.com. Leave empty if you
      are in exactly one dynasty league and it will be found automatically.
  strategy:
    name: Default strategy
    description: >-
      auto follows your team's position (in a playoff spot = win now, out of it
      = rebuild). You can also pick per run on the page.
  schedule:
    name: Scheduled runs
    description: >-
      When to run automatically and notify your phone, like "tue 18:00" or
      "daily 09:00", in Home Assistant's timezone. Sleeper waivers clear just
      after midnight Pacific going into Wednesday, so keep a Tuesday evening run.
  notify_service:
    name: Notify service
    description: >-
      Your phone's notify service without the "notify." prefix, e.g.
      mobile_app_iphone. Leave empty to run on schedule without notifying.
  untouchable:
    name: Untouchable players
    description: >-
      Players the advisor must never offer in a trade, by name (e.g.
      "Bijan Robinson"). Young players whose value is rising are protected
      automatically: they're only offered when the return has no veterans in
      it and loses no long-term value.
  anthropic_api_key:
    name: Anthropic API key
    description: >-
      Turns on the AI review. Claude reads every trade idea and pickup with
      both rosters and recent news, and marks each go, consider or pass with a
      reason. Ideas it passes on move to a collapsed list. About $0.20 a run,
      billed to your Anthropic account. Leave empty to turn it off.
  ai_model:
    name: AI review model
    description: >-
      Which Claude model reviews the ideas.
  log_level:
    name: Log level
