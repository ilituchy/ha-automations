---
slug: nba_autopilot
name: NBA Fantasy Autopilot
version: "0.1.0"
description: >-
  Automated ESPN fantasy basketball lineup management with Home Assistant
  notifications and approval taps.
url: https://github.com/ilituchy/ha-automations/tree/main/nba_autopilot

arch:
  - aarch64
  - amd64

# The base image ships s6-overlay v3, which is the container's init.
init: false

# Core REST API + WebSocket, both via the Supervisor proxy at http://supervisor/core.
homeassistant_api: true

# Ingress: the status UI is served only through the HA sidebar. No `ports:` key is
# declared, so 8099 is never published on the host.
ingress: true
ingress_port: 8099
panel_icon: mdi:basketball
panel_title: NBA Autopilot

# /data is private, persistent and backed up automatically -- it needs no `map:`
# entry. The SQLite DB at /data/autopilot.db is therefore already durable.
# `app_config` is mapped read-only so the app can resolve entity/device ids
# against the HA configuration when validating options.
map:
  - type: app_config
    read_only: true

options:
  # One entry per team you manage. Leagues are optimized independently --
  # rosters, player values and the games-played budget never pool across
  # them. `label` is what notifications say, so make it recognisable.
  #
  # `season` is optional and almost always left at 0, which means "work it out
  # from the date". Set it only to override, and note that ESPN labels a season
  # by the year it *ends* in: the 2026-27 NBA season is 2027. This is worth
  # being careful about because the wrong season does not error -- ESPN serves
  # a finished season happily, with final standings, which looks like a
  # plausible late-season state rather than like a mistake.
  leagues:
    - league_id: 0
      team_id: 0
      label: ""
      season: 0
  espn_s2: null
  espn_swid: null
  ha_notify_device: mobile_app_iphone
  ha_owner_user_id: null
  ha_todo_entity: todo.fantasy_autopilot
  timezone: America/Los_Angeles
  run_times:
    - "09:00"
  autonomy_lineup: true
  autonomy_ir: true
  autonomy_add_drop: false
  never_drop: []
  max_faab_bid: 0
  shadow_mode: true
  log_level: info

schema:
  leagues:
    - league_id: int(1,)
      team_id: int(1,)
      label: str?
      season: int(0,2100)?
  espn_s2: password
  espn_swid: password
  ha_notify_device: str
  ha_owner_user_id: str
  ha_todo_entity: str
  timezone: str
  run_times:
    - str
  autonomy_lineup: bool
  autonomy_ir: bool
  autonomy_add_drop: bool
  never_drop:
    - str
  max_faab_bid: int(0,1000)
  shadow_mode: bool
  log_level: list(trace|debug|info|notice|warning|error|fatal)
