---
slug: nba_autopilot
name: NBA Fantasy Autopilot
version: "0.1.0"
description: >-
  Automated ESPN fantasy basketball lineup management with Home Assistant
  notifications and approval taps.
url: https://github.com/ilituchy/ha-automations/tree/main/nba_autopilot

arch:
  - aarch64
  - amd64

# The base image ships s6-overlay v3, which is the container's init.
init: false

# Core REST API + WebSocket, both via the Supervisor proxy at http://supervisor/core.
homeassistant_api: true

# Ingress: the status UI is served only through the HA sidebar. No `ports:` key is
# declared, so 8099 is never published on the host.
ingress: true
ingress_port: 8099
panel_icon: mdi:basketball
panel_title: NBA Autopilot

# /data is private, persistent and backed up automatically -- it needs no `map:`
# entry. The SQLite DB at /data/autopilot.db is therefore already durable.
# `app_config` is mapped read-only so the app can resolve entity/device ids
# against the HA configuration when validating options.
map:
  - type: app_config
    read_only: true

options:
  # One entry per team you manage. Leagues are optimized independently --
  # rosters, player values and the games-played budget never pool across
  # them. `label` is what notifications say, so make it recognisable.
  #
  # `season` is optional and almost always left at 0, which means "work it out
  # from the date". Set it only to override, and note that ESPN labels a season
  # by the year it *ends* in: the 2026-27 NBA season is 2027. This is worth
  # being careful about because the wrong season does not error -- ESPN serves
  # a finished season happily, with final standings, which looks like a
  # plausible late-season state rather than like a mistake.
  #
  # `keeper` says this league keeps players between seasons. It is asked here
  # rather than read from ESPN because ESPN's own keeper flag describes a draft
  # mechanic and reads the same in a dynasty league as in a redraft one -- only
  # you know which roster you are building for next year. It changes one
  # decision: in a keeper league a player out for the season is an asset worth
  # holding, and in a redraft league he is a free roster spot.
  leagues:
    - league_id: 0
      team_id: 0
      label: ""
      season: 0
      keeper: false
  espn_s2: null
  espn_swid: null
  ha_notify_device: mobile_app_iphone
  ha_owner_user_id: null
  ha_todo_entity: todo.fantasy_autopilot
  timezone: America/Los_Angeles
  run_times:
    - "09:00"
  autonomy_lineup: true
  autonomy_ir: true
  autonomy_add_drop: false
  never_drop: []
  max_faab_bid: 0
  # How much better per game a pickup has to be than the player going out
  # before a swap is made on quality alone, in percent. 12 is the middle of
  # the 10-15% range; lower proposes more moves, higher proposes fewer.
  #
  # This gate is about quality only. It never blocks a pickup who simply has
  # more games left this week than the man he replaces -- those are free
  # points, and they are decided by `addrop_churn_floor` instead.
  addrop_margin_pct: 12
  # The smallest projected gain, in fantasy points, worth making a permanent
  # move for. Every roster has some swap available that gains a fraction of a
  # point; taking all of them spends a whole week's acquisitions on noise.
  # Waived automatically when the move would by itself erase the deficit in
  # the current matchup.
  addrop_churn_floor: 3
  # How many swaps one run may offer you, each as its own approval. A run that
  # sees three worthwhile moves and shows only the best of them leaves the other
  # two until tomorrow, and in a four-day week tomorrow is a quarter of it.
  #
  # Each one after the first is priced as if the ones above it go through --
  # the roster, the pool and the acquisition count all advance -- so the list
  # runs best-first and the later entries are the least certain. Approving them
  # out of order is fine; the numbers on the lower cards just assume company.
  # Your league's acquisition limit still caps the real total.
  addrop_max_moves: 3
  # An Anthropic API key turns on the add/drop review. Every proposed swap is
  # then shown to Claude first, with both players' numbers, how much of the
  # league owns each of them, where they were drafted and ESPN's own injury
  # reporting, and asked whether the statistical case actually holds up. It can
  # block a swap, and when it does it says why -- on the status page, in its
  # own words.
  #
  # This exists because the points model is blind to everything outside the
  # current week, so a first-round pick with a two-week injury is worth exactly
  # zero to it and becomes the cheapest man on the roster to give away. The
  # review is the only part of the app that knows who players are.
  #
  # Leave it empty and nothing changes: swaps are proposed exactly as before.
  # Fill it in and a swap the reviewer could not be reached about is **not**
  # shown, because a timed-out request is not permission to make an
  # irreversible move unexamined.
  anthropic_api_key: ""
  ai_judge_model: claude-sonnet-4-6
  shadow_mode: true
  log_level: info

schema:
  leagues:
    - league_id: int(1,)
      team_id: int(1,)
      label: str?
      season: int(0,2100)?
      keeper: bool?
  espn_s2: password
  espn_swid: password
  ha_notify_device: str
  ha_owner_user_id: str
  ha_todo_entity: str
  timezone: str
  run_times:
    - str
  autonomy_lineup: bool
  autonomy_ir: bool
  autonomy_add_drop: bool
  never_drop:
    - str
  max_faab_bid: int(0,1000)
  addrop_margin_pct: float(0,100)
  addrop_churn_floor: float(0,500)
  addrop_max_moves: int(1,5)
  anthropic_api_key: password?
  ai_judge_model: str?
  shadow_mode: bool
  log_level: list(trace|debug|info|notice|warning|error|fatal)
